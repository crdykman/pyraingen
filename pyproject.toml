[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyraingen"
version = "2.0.1"
description = "A package for stochastically generating daily and subdaily rainfall in Australia with ifd constraining."
readme = "README.md"
requires-python = ">=3.9,<4.0"
authors = [{ name = "Caleb Dykman" }]
# No license field: poetry recorded the literal string "None", which is not a
# valid SPDX expression and is rejected by setuptools>=77. The terms are stated
# in README.md. Set an SPDX expression here (e.g. "LicenseRef-Proprietary", or
# a real licence) if the metadata should carry them.
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
    "numba>=0.56",
    "netCDF4>=1.6",
    "scipy>=1.9",
    "joblib>=1.2",
    "pandas>=1.5",
    "xarray>=2022.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = ["myst-nb", "sphinx-autoapi", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyraingen*"]

# setuptools ships only .py files unless told otherwise. The generator reads
# its station record, regression coefficients and bundled example data through
# importlib.resources, so these must travel with the package.
[tool.setuptools.package-data]
"*" = ["*.csv", "*.dat", "*.nc", "*.txt"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyd", "__pycache__/*"]
